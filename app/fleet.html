<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nordic Metro — delay risk</title>
  <style>
    body { font-family: Georgia, serif; margin: 24px; color: #1c1c1c; background: #f7f6f3; }
    h1 { font-size: 22px; font-weight: normal; margin: 0 0 4px; }
    p { margin: 0 0 12px; }
    main { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: start; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
    tr { cursor: pointer; }
    tr.selected { background: #ece7dc; }
    section { background: white; padding: 16px; }
    button { font: inherit; padding: 6px 10px; }
    textarea { width: 100%; min-height: 72px; font: inherit; }
    .bar { height: 8px; background: #8a3b2b; margin-top: 4px; }
    .muted { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Nordic Metro</h1>
  <p class="muted">Assets ranked by delay minutes at risk if they fail in service.</p>
  <main>
    <div>
      <section>
        <h2>Delay minutes by system</h2>
        <div id="by-system"></div>
      </section>
      <section>
        <h2>Assets by state</h2>
        <div id="by-state"></div>
      </section>
      <h2>Needs attention</h2>
      <table>
        <thead>
          <tr><th>Train</th><th>Car</th><th>System</th><th>Component</th><th>State</th><th>Delay min</th></tr>
        </thead>
        <tbody id="attention"></tbody>
      </table>
      <h2>Full fleet</h2>
      <table>
        <thead>
          <tr><th>Train</th><th>Car</th><th>System</th><th>Component</th><th>State</th><th>Delay min</th></tr>
        </thead>
        <tbody id="fleet"></tbody>
      </table>
    </div>
    <section id="detail"><p class="muted">Select an asset.</p></section>
  </main>
  <script>
    var fleet = [];
    var selectedId = null;

    function load() {
      fetch("/fleet").then(function (response) { return response.json(); }).then(function (rows) {
        fleet = rows;
        drawFleet();
        drawCharts();
        if (!selectedId && rows.length) openAsset(rows[0].id);
      });
    }

    function fillTable(id, rows) {
      var body = document.getElementById(id);
      body.innerHTML = "";
      rows.forEach(function (row) {
        var tr = document.createElement("tr");
        if (row.id === selectedId) tr.className = "selected";
        tr.innerHTML = "<td>" + row.train + "</td><td>" + row.car + "</td><td>" + row.system
          + "</td><td>" + row.component + "</td><td>" + row.state.replace(/_/g, " ")
          + "</td><td>" + row.delay_risk_minutes + "</td>";
        tr.onclick = function () { openAsset(row.id); };
        body.appendChild(tr);
      });
    }

    function drawFleet() {
      fillTable("attention", fleet.filter(function (row) { return row.state !== "healthy"; }));
      fillTable("fleet", fleet);
    }

    function drawCharts() {
      var totals = {};
      var states = {};
      fleet.forEach(function (row) {
        totals[row.system] = (totals[row.system] || 0) + row.delay_risk_minutes;
        states[row.state] = (states[row.state] || 0) + 1;
      });
      barChart("by-system", totals, " min");
      barChart("by-state", states, "");
    }

    function barChart(id, totals, suffix) {
      var box = document.getElementById(id);
      var names = Object.keys(totals).sort(function (a, b) { return totals[b] - totals[a]; });
      var max = names.reduce(function (peak, name) { return Math.max(peak, totals[name]); }, 1);
      box.innerHTML = "";
      names.forEach(function (name) {
        var value = Math.round(totals[name] * 10) / 10;
        var row = document.createElement("div");
        row.style.marginBottom = "8px";
        row.innerHTML = "<div>" + name.replace("_", " ") + " — " + value + suffix + "</div>";
        var bar = document.createElement("div");
        bar.className = "bar";
        bar.style.width = (100 * totals[name] / max) + "%";
        row.appendChild(bar);
        box.appendChild(row);
      });
    }

    function openAsset(id) {
      selectedId = id;
      drawFleet();
      fetch("/assets/" + id).then(function (response) { return response.json(); }).then(drawDetail);
    }

    function byMetric(readings) {
      var grouped = {};
      readings.forEach(function (reading) {
        if (!grouped[reading.metric]) grouped[reading.metric] = [];
        grouped[reading.metric].push(reading);
      });
      return grouped;
    }

    function latestText(readings) {
      var grouped = byMetric(readings);
      var names = Object.keys(grouped);
      if (!names.length) return "none";
      return names.map(function (name) {
        var points = grouped[name];
        return name + " " + points[points.length - 1].value;
      }).join(", ");
    }

    function trendText(readings) {
      var grouped = byMetric(readings);
      var names = Object.keys(grouped);
      if (!names.length) return "No readings.";
      return names.map(function (name) {
        var points = grouped[name];
        return name + " moved from " + points[0].value + " to " + points[points.length - 1].value;
      }).join(". ") + " over 14 days.";
    }

    function trainTree(train) {
      var cars = {};
      fleet.filter(function (row) { return row.train === train; }).forEach(function (row) {
        if (!cars[row.car]) cars[row.car] = [];
        cars[row.car].push(row.system + " " + row.state.replace(/_/g, " "));
      });
      return Object.keys(cars).sort().map(function (car) {
        return "Car " + car + ": " + cars[car].join(", ");
      }).join(". ");
    }

    function drawDetail(asset) {
      var similar = fleet.filter(function (row) {
        return row.system === asset.system && row.id !== asset.id && row.state !== "healthy";
      }).slice(0, 3);
      var readings = asset.readings;
      var trend = trendText(readings);
      var similarText = similar.length
        ? similar.map(function (row) { return row.train + " car " + row.car + " (" + row.delay_risk_minutes + " min)"; }).join(", ")
        : "None.";
      var draft = asset.recommendations[asset.recommendations.length - 1];
      var draftBlock = draft
        ? "<p>" + draft.action + "</p><p class=\"muted\">" + draft.window + " · " + draft.delay_minutes_avoided + " delay minutes · " + draft.status + "</p>"
          + "<textarea id=\"edit\">" + draft.action + "</textarea><p><button id=\"accept\">Accept</button> <button id=\"save-edit\">Save edit</button></p>"
        : "<p class=\"muted\">No recommendation yet.</p>";
      document.getElementById("detail").innerHTML =
        "<h2>" + asset.train + " · car " + asset.car + " · " + asset.component + "</h2>"
        + "<p>Measurements: " + latestText(readings)
        + ". TraceRail read those values as " + asset.state.replace("_", " ") + ", health " + asset.health_score + ".</p>"
        + "<p>" + asset.formula + "</p>"
        + "<p>" + asset.failure_probability + " × " + asset.typical_delay_minutes + " min = " + asset.delay_risk_minutes + " delay minutes at risk.</p>"
        + "<p>If we wait until the next exam: " + asset.if_wait_delay_minutes + " delay minutes.</p>"
        + "<p>" + trend + "</p>"
        + "<p>" + trainTree(asset.train) + "</p>"
        + "<p>Other " + asset.system + " to watch: " + similarText + "</p>"
        + "<p><button id=\"recommend\">Recommend maintenance</button></p>"
        + draftBlock;
      document.getElementById("recommend").onclick = function () {
        fetch("/assets/" + asset.id + "/recommend", { method: "POST" }).then(function () { openAsset(asset.id); });
      };
      if (draft) {
        document.getElementById("accept").onclick = function () { decide(draft.id, "accepted", null); };
        document.getElementById("save-edit").onclick = function () {
          decide(draft.id, "edited", document.getElementById("edit").value);
        };
      }
    }

    function decide(id, status, edited) {
      fetch("/recommendations/" + id + "/decision", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: status, edited_action: edited })
      }).then(function () { openAsset(selectedId); });
    }

    load();
  </script>
</body>
</html>
